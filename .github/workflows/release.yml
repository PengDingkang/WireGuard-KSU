name: Release Module

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag (e.g. v1.0.0)
        required: false
        type: string
      prerelease:
        description: Mark as prerelease
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git make file shellcheck zip unzip python3 g++-aarch64-linux-gnu

      - name: Read module metadata
        id: meta
        run: |
          module_version="$(sed -n 's/^version=//p' module.prop)"
          tag_name="${{ github.event.inputs.tag_name }}"
          [ -z "$tag_name" ] && tag_name="$module_version"
          package_name="WireGuard-KSU-${module_version}.zip"
          echo "module_version=${module_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "package_name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "release_name=WireGuard KSU ${module_version}" >> "$GITHUB_OUTPUT"

      - name: Validate and test
        run: sh scripts/ci/validate.sh

      - name: Build wg tool for aarch64
        run: sh scripts/ci/build-wg.sh

      - name: Create release package
        run: sh scripts/ci/package-module.sh "dist/${{ steps.meta.outputs.package_name }}"

      - name: Verify package contents
        run: sh scripts/ci/verify-package.sh "dist/${{ steps.meta.outputs.package_name }}"

      - name: Prepare release notes
        run: |
          awk '
            /^# / {
              if (in_section) exit
              in_section = 1
              next
            }
            in_section { print }
          ' changelog.md > dist/release-notes.md
          test -s dist/release-notes.md

      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/${{ steps.meta.outputs.package_name }}
          fail_on_unmatched_files: true
          body_path: dist/release-notes.md
          generate_release_notes: true

      - name: Verify public ZIP and prepare update metadata
        if: ${{ !inputs.prerelease }}
        env:
          RELEASE_ASSETS: ${{ steps.release.outputs.assets }}
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          python3 scripts/ci/prepare-update.py \
            --package "dist/$PACKAGE_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output dist/update.json

      - name: Checkout current update branch
        if: ${{ !inputs.prerelease }}
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .update-metadata

      - name: Publish stable update metadata
        if: ${{ !inputs.prerelease }}
        env:
          UPDATE_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag_name }}
        run: |
          sh scripts/ci/publish-update.sh \
            "$GITHUB_WORKSPACE/dist/update.json" \
            "$GITHUB_WORKSPACE/.update-metadata" \
            "$UPDATE_BRANCH" "$RELEASE_TAG"
